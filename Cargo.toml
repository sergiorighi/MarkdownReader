[package]
name = "MarkdownReader"
version = "1.0.0"
edition = "2021"

[dependencies]
wry = "0.47"
tao = "0.30"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
open = "5.3"
percent-encoding = "2.3"
rfd = "0.15"
interprocess = "2.2"
[build-dependencies]
winres = "0.1"
